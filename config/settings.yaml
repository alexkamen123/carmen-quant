models:
  analysis:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3
    max_tokens: 1000

  decision:
    provider: anthropic
    model: claude-sonnet-4-5
    temperature: 0.2
    max_tokens: 1500

signals:
  rsi:
    overbought: 70
    oversold: 30
    lookback: 14
  ma:
    short: 5
    medium: 20
    long: 60
  min_confidence: 0.55

notifications:
  feishu:
    enabled: true
    # 注意：send_hour 不被代码读取，定时调度请在 GitHub Actions workflow 或 crontab 中配置

backtest:
  lookback_days: 30
  win_threshold_pct: 1.0

# ── 战略约束注入配置（L1 → L2 传导开关）────────────────────────────────────
# 控制 portfolio.yaml 中 strategy.risk_limits 如何出现在 PM 裁决 prompt 里
strategy_injection:
  enabled: true
  # 在 PM_BATCH_USER prompt 中自动插入红线约束区块
  inject_into_pm_prompt: true
  # 在周报配置建议中自动插入战略目标区块
  inject_into_weekly_report: true
  # 飞书推送：是否在日报消息头部显示当前红线状态（绿/黄/红）
  show_limit_status_in_daily: true

# ── 防追高护栏（L3a，PM 裁决后确定性 clamp）──────────────────────────────────
# 只把"加仓/买入"降级为"维持/观望"，绝不反向激进；误报最坏=踏空，不会乱买。
# 一键关：误报时临时设 false，无需删代码。
anti_chase_guard:
  enabled: true
