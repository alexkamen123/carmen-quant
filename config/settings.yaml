models:
  analysis:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3
    max_tokens: 1000

  decision:
    provider: anthropic
    model: claude-sonnet-4-5
    temperature: 0.2
    max_tokens: 1500

signals:
  rsi:
    overbought: 70
    oversold: 30
    lookback: 14
  ma:
    short: 5
    medium: 20
    long: 60
  min_confidence: 0.55

notifications:
  feishu:
    enabled: true
    # 注意：send_hour 不被代码读取，定时调度请在 GitHub Actions workflow 或 crontab 中配置

backtest:
  lookback_days: 30
  win_threshold_pct: 1.0

# ── 战略约束注入配置（L1 → L2 传导开关）────────────────────────────────────
# 控制 portfolio.yaml 中 strategy.risk_limits 如何出现在 PM 裁决 prompt 里
strategy_injection:
  enabled: true
  # 在 PM_BATCH_USER prompt 中自动插入红线约束区块
  inject_into_pm_prompt: true
  # 在周报配置建议中自动插入战略目标区块
  inject_into_weekly_report: true
  # 飞书推送：是否在日报消息头部显示当前红线状态（绿/黄/红）
  show_limit_status_in_daily: true

# ── 防追高护栏（L3a，PM 裁决后确定性 clamp）──────────────────────────────────
# 只把"加仓/买入"降级为"维持/观望"，绝不反向激进；误报最坏=踏空，不会乱买。
# 一键关：误报时临时设 false，无需删代码。
anti_chase_guard:
  enabled: true

# ── L2b 实盘反馈回流注入（order7）────────────────────────────────────────────
# 把该票历史实盘建议的 7d 胜率/均值注入 PM 裁决材料（strategy_evidence 槽）。
# 样本闸门：买入+卖出方向合并 n>=3 才注入，不足完全静默。
# 一键关：误导/过载时设 false，无需删代码。
live_feedback_injection:
  enabled: true

# ── dip 预警 ATR 自适应阈值（order8）────────────────────────────────────────
# effective = max(base_pct, min(k * atr_pct, cap_pct))；gap_up 抬升叠加在此结果上。
# 只抬升不下调（effective >= base_pct），低波动票不会被降阈值。
# 一键关：设 false 回退写死 3.0%，行为与改动前一致。
dip_atr_adaptive:
  enabled: true
  base_pct: 3.0
  k: 0.8
  cap_pct: 7.0

# ── 用户行为时机提示（order9）────────────────────────────────────────────────
# dip 加仓卡片 + log-action BUY 时展示用户历史买入行为统计（描述性，不说教）。
# 样本闸门：已回填 BUY 数 < min_n_buy 完全静默。
# 一键关：觉得烦时临时设 false，无需改代码。
behavior_hint:
  enabled: true
  min_n_buy: 5
  sell_regret_pct: 5.0

# ── L2c 策略族自适应权重（评估→反哺参数的最后一根线）─────────────────────────
# 每轮 backfill 后按各策略族真实 beat_rate 朴素升降权，下一轮 get_active_signals
# 读这张表（data/strategy_weights.json）给信号排序加权。权重只调"先给 PM 看哪条
# 证据"的次序，绝不放大金额/仓位，误差最坏=排序略偏，不会乱买。
# 默认 ON 但步幅极小（damping/sensitivity 小、max_step 硬阻尼）→ 单轮几乎不改变行为。
# 一键关：设 false 后 get_strategy_weight 恒返 1.0，排序与改动前完全一致。
# 可回溯：每次真实调整 append 一条到 data/strategy_weights_log.jsonl。
strategy_weight_adaptation:
  enabled: true
  sensitivity: 0.3   # beat_rate 每偏离 0.5 个 0.1 → 目标权重偏 0.03
  damping: 0.1       # 每轮只向目标走 10%
  min_weight: 0.7    # 权重下限（绝不归零）
  max_weight: 1.3    # 权重上限（绝不翻倍）
  min_combos: 3      # 族内有效组合 < 此值则保持 1.0
  max_step: 0.05     # 单轮单族最大变动幅度（硬阻尼兜底）
