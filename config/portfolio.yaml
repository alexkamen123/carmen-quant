# ── 账户规模配置（供 Position Sizer 计算建议股数）──────────────────────────
# 填写实际可交易资金规模；risk_per_trade_pct = 单笔操作可接受的最大亏损占比
account:
  usd: 1065            # 美股账户规模（USD）
  hkd: 7589            # 港股账户规模（HKD）
  risk_per_trade_pct: 5.0   # 每笔交易最大亏损 = 账户规模 × 此值%
