# ── 账户规模配置（供 Position Sizer 计算建议股数）──────────────────────────
# 填写实际可交易资金规模；risk_per_trade_pct = 单笔操作可接受的最大亏损占比
account:
  usd: 1035            # 美元储蓄余额（2026-06-05 汇丰截图实测）
  hkd: 390             # 港元储蓄余额（2026-06-05 汇丰截图实测；港元现金基本耗尽）
  hkd_fixed: 15672     # 定期存款（2026-06-05 汇丰截图；压舱石，不用于股票）
  cnh: 3220            # 离岸人民币储蓄（2026-06-05 汇丰截图；CNH 可灵活换汇为 HKD/USD，约 $444 等值）
  investment_hkd: 41282  # 投资账户总市值（2026-06-05 汇丰截图；含所有持仓）
  risk_per_trade_pct: 5.0   # 每笔交易最大亏损 = 账户规模 × 此值%

# ── 战略配置锚点（L1 粥卡门分析输出，最高优先级）──────────────────────────
# 此区块由粥卡门配置分析会话手动更新，不被日常信号自动覆盖。
# 更新频率：每月/季度复盘后，或宏观环境发生重大变化时。
# 最后更新：2026-06-02（粥卡门配置分析 v1）
strategy:
  last_updated: "2026-06-02"
  source: "粥卡门配置分析"

  # 月定投资金分配比例（三桶模型）
  monthly_dca:
    passive_beta_pct: 50      # 被动Beta桶：QQQM/VOO等宽基ETF
    hedge_pct: 25             # 对冲桶：IAU/BIL
    ammo_pct: 25              # 弹药桶：机动资金，等待战术机会

  # 对冲桶持仓目标（当前尚未建仓，目标：IAU 3股 + SGOV 4股）
  hedge_bucket:
    target_pct: 12.0          # 对冲桶占总投资组合最低比例（低于此值触发警告）
    holdings:
      - ticker: IAU
        label: "黄金ETF（减震器）"
        target_shares: 3
        notes: "目标3股（约$80/股）；A股已有3克实物黄金敞口，IAU 仓位可偏小"
      - ticker: SGOV
        label: "0-3月美债ETF（压舱石）"
        target_shares: 4
        notes: "目标4股（约$100/股）；2026-06-07 选用SGOV替代BIL：费率0.09%<0.135%、久期更短(0-3月vs1-3月)、当前SEC收益率~3.55%"

  # 风险红线（PM裁决必须遵守，不可因战术信号突破）
  risk_limits:
    - name: "半导体集中度上限"
      rule: "sector:半导体/AI算力 <= 45%"
      current: "42.2%"          # 最近一次粥卡门分析时的实际值
      action_if_breached: "立即停止半导体加仓，触发集中度警告"
      note: "当前已接近红线，不再加仓任何半导体标的"

    - name: "单只股票上限"
      rule: "single_ticker <= 15%"
      action_if_breached: "超过15%须减仓至15%以下"

    - name: "对冲桶下限"
      rule: "hedge_bucket >= 12%"
      action_if_breached: "优先补充IAU/SGOV，暂缓其他新建仓"
