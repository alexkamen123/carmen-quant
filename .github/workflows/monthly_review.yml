# .github/workflows/monthly_review.yml
name: 月度投资回顾

on:
  schedule:
    # 每月1日北京时间 10:00 = UTC 02:00
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  monthly-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -e .

      - name: 安装 Claude Code CLI（供 OAuth Token 路径使用）
        run: npm install -g @anthropic-ai/claude-code

      # 恢复历史数据库（需要上月推荐数据）
      - name: 恢复历史数据库
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily_analysis.yml
          name_is_regexp: true
          name: "agent-db-.*"
          path: data/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 整理数据库路径
        run: |
          mkdir -p data
          found=$(find data -name "agent.db" | xargs ls -t 2>/dev/null | head -1)
          if [ -n "$found" ] && [ "$found" != "data/agent.db" ]; then
            mv "$found" data/agent.db
          fi

      - name: 运行月度回顾
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN:  ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY:         ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL:       ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET:    ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: finance-agent monthly-review
