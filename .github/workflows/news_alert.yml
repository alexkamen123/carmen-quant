# .github/workflows/news_alert.yml
name: 盘中新闻扫描

# 覆盖两个市场时段：
#   港股时段：北京 09:00-16:00 = UTC 01:00-08:00
#   美股时段：北京 21:00-06:00(次日) = UTC 13:00-22:00
#   （含美股盘前 04:00 EST = UTC 09:00 = 北京 17:00，由美股段首触覆盖）
#
# 注意：美股新闻无需港股时段扫描，港股新闻无需美股时段扫描。
# yfinance news API 会返回各自市场的新闻，两段 cron 共用同一 job 即可。

on:
  schedule:
    # 港股时段：UTC 01-08，每小时整点（周一到周五）
    - cron: "0 1-8 * * 1-5"
    # 美股时段：UTC 13-22，每小时整点（周一到周五）
    # 注：UTC 22 = 北京次日 06:00，覆盖美股盘后
    - cron: "0 13-22 * * 1-5"
  workflow_dispatch:
    inputs:
      threshold:
        description: "影响度阈值（默认 7）"
        required: false
        default: "7"

jobs:
  news-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read    # dawidd6/action-download-artifact 列举历史 artifact 需要
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 安装依赖
        run: pip install -e .

      # ── 恢复新闻去重数据库（防止同一条新闻重复推送）──────────────────
      - name: 恢复历史数据库
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: news_alert.yml
          name_is_regexp: true
          name: "news-db-.*"
          path: data/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 整理数据库路径
        run: |
          mkdir -p data
          found=$(find data -name "agent.db" | xargs ls -t 2>/dev/null | head -1)
          if [ -n "$found" ] && [ "$found" != "data/agent.db" ]; then
            mv "$found" data/agent.db
            echo "已恢复历史数据库：$found"
          elif [ -f "data/agent.db" ]; then
            echo "历史数据库已就位"
          else
            echo "无历史数据库，本次为首次运行"
          fi

      - name: 扫描持仓新闻
        env:
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL:    ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          THRESHOLD=${{ github.event.inputs.threshold || '7' }}
          finance-agent news-scan --threshold $THRESHOLD

      # ── 保存更新后的数据库（去重记录持久化）──────────────────────────
      - name: 上传去重数据库
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-db-${{ github.run_number }}
          path: data/agent.db
          retention-days: 7
