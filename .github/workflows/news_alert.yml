# .github/workflows/news_alert.yml
name: 盘中新闻扫描

on:
  schedule:
    # 北京时间 09:00-17:00 = UTC 01:00-09:00，每小时整点扫描
    # 09:00, 10:00, 11:00, 13:00, 14:00, 15:00, 16:00, 17:00 BJ
    - cron: "0 1-9 * * 1-5"
  workflow_dispatch:   # 允许手动触发测试
    inputs:
      threshold:
        description: "影响度阈值（默认 7）"
        required: false
        default: "7"

jobs:
  news-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -e .

      - name: 扫描持仓新闻
        env:
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL:    ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          THRESHOLD=${{ github.event.inputs.threshold || '7' }}
          finance-agent news-scan --threshold $THRESHOLD
