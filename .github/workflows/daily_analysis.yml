# .github/workflows/daily_analysis.yml
name: 每日持仓分析

on:
  schedule:
    # 港股场：北京时间 09:00 = UTC 01:00
    - cron: "0 1 * * 1-5"
    # 美股场：北京时间 21:30 = UTC 13:30
    - cron: "30 13 * * 1-5"
  workflow_dispatch:          # 允许手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read      # dawidd6/action-download-artifact 列举历史 artifact 需要
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -e .

      - name: 安装 Claude Code CLI（供 OAuth Token 路径使用）
        run: npm install -g @anthropic-ai/claude-code

      # ── 恢复上一次的 SQLite 历史数据 ──────────────────────────
      - name: 恢复历史数据库
        continue-on-error: true   # 首次运行无 artifact 时跳过，不中断流程
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: daily_analysis.yml
          name_is_regexp: true
          name: "agent-db-.*"
          path: data/
          if_no_artifact_found: ignore
          search_artifacts: true

      # artifact 下载后可能在子目录，统一移到 data/agent.db
      - name: 整理数据库路径
        run: |
          mkdir -p data
          found=$(find data -name "agent.db" | xargs ls -t 2>/dev/null | head -1)
          if [ -n "$found" ] && [ "$found" != "data/agent.db" ]; then
            mv "$found" data/agent.db
            echo "已恢复历史数据库：$found"
          elif [ -f "data/agent.db" ]; then
            echo "历史数据库已就位"
          else
            echo "无历史数据库，本次为首次运行"
          fi

      - name: 运行每日分析
        env:
          # 优先使用 ANTHROPIC_API_KEY（SDK 直连，稳定）
          # 备选：CLAUDE_CODE_OAUTH_TOKEN（Claude Pro 订阅，免 API 费用）
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN:  ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEEPSEEK_API_KEY:         ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL:       ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET:    ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: finance-agent run

      # ── 上传本次生成的数据库（含今日新记录）──────────────────
      - name: 上传 SQLite 数据库（保留历史）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-db-${{ github.run_number }}
          path: data/agent.db
          retention-days: 60
