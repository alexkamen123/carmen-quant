# .github/workflows/price_alert.yml
name: 盘中价格异动扫描

# 覆盖两个市场交易时段（北京时间）：
#   港股：09:30-16:00 BJ = UTC 01:30-08:00
#   美股：21:30-04:00 BJ = UTC 13:30-20:00（盘前 16:00 BJ = UTC 08:00 起算）
#
# 每 10 分钟触发：*/5 高频 cron 在 GitHub Actions 会被大量丢弃；
# 降为 */10 兼顾可靠性与及时性。
# 漏报兜底：_check_price_drop 同时检测「较开盘跌幅 ≥ 4.5%」，
# 即使扫描延迟 2-3 小时，开盘急跌仍能被识别。

on:
  schedule:
    # 港股交易时段：UTC 01:30-08:00，每 10 分钟（周一到周五）
    - cron: "*/10 1-7 * * 1-5"
    - cron: "*/10 8 * * 1-5"
    # 美股盘前+正式交易时段：UTC 13:30-20:00，每 10 分钟（周一到周五）
    - cron: "*/10 13-19 * * 1-5"
    - cron: "*/10 20 * * 1-5"
  workflow_dispatch:
    inputs:
      threshold:
        description: "1小时跌幅阈值（默认 3.0%）"
        required: false
        default: "3.0"

jobs:
  price-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read    # dawidd6/action-download-artifact 需要
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 安装依赖
        run: pip install -e .

      # ── 恢复价格异动去重数据库 ──────────────────────────────────────
      - name: 恢复历史数据库
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: price_alert.yml
          name_is_regexp: true
          name: "price-db-.*"
          path: data/
          if_no_artifact_found: ignore
          search_artifacts: true

      - name: 整理数据库路径
        run: |
          mkdir -p data
          found=$(find data -name "agent.db" | head -1)
          if [ -n "$found" ] && [ "$found" != "data/agent.db" ]; then
            mv "$found" data/agent.db
          fi

      - name: 扫描价格异动
        env:
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL:    ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          THRESHOLD=${{ github.event.inputs.threshold || '3.0' }}
          finance-agent price-scan --threshold $THRESHOLD

      # ── 保存更新后的数据库 ──────────────────────────────────────────
      - name: 上传去重数据库
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-db-${{ github.run_number }}
          path: data/agent.db
          retention-days: 3
