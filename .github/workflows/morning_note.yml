name: Morning Note

on:
  schedule:
    # 每个交易日北京时间 08:55（UTC 00:55）联网搜索隔夜行情，推送盘前晨报
    # 比日报(daily_analysis 09:00)早 5 分钟，形成"晨报→日报"的阅读顺序
    - cron: "55 0 * * 1-5"
  workflow_dispatch:  # 支持手动触发

jobs:
  morning-note:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install Claude Code CLI（供 OAuth Token 的联网搜索路径使用）
        run: npm install -g @anthropic-ai/claude-code

      - name: Run morning note
        # 本仓库用 CLAUDE_CODE_OAUTH_TOKEN（Apple 订阅，免 API 费）→ 走 Claude Code CLI
        # 的 WebSearch 工具完成联网搜索；若日后配了 ANTHROPIC_API_KEY 则自动改走 SDK 原生 web_search。
        env:
          FEISHU_WEBHOOK_URL:      ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET:   ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run finance-agent morning-note
